<!doctype html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>DISMAT Magazzino</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dark-theme">

<div class="app">

    <aside class="sidebar">

        <img src="{{ url_for('static', filename='images/logo-dismat.jpeg') }}"
             class="logo"
             alt="DISMAT">

        <nav class="nav flex-column mt-4 sidebar-nav">

            <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
               href="{{ url_for('home') }}">
                <i class="bi bi-grid me-2"></i>
                Dashboard
            </a>

            <a class="nav-link {% if request.endpoint in ['articoli', 'nuovo_articolo', 'modifica', 'dettaglio_articolo'] %}active{% endif %}"
               href="{{ url_for('articoli') }}">
                <i class="bi bi-box-seam me-2"></i>
                Articoli
            </a>

            <a class="nav-link {% if request.endpoint == 'archivio_articoli' %}active{% endif %}"
               href="{{ url_for('archivio_articoli') }}">
                <i class="bi bi-archive me-2"></i>
                Archivio
            </a>

            <a class="nav-link" href="#">
                <i class="bi bi-arrow-left-right me-2"></i>
                Movimenti
            </a>

            <a class="nav-link" href="#">
                <i class="bi bi-truck me-2"></i>
                Fornitori
            </a>


            {% if session.get("utente_id") %}

                <div class="nav-user">
                    <i class="bi bi-person-circle me-2"></i>
                    {{ session.get("nome") }}
                </div>

                <a class="nav-link"
                   href="{{ url_for('logout') }}">
                    <i class="bi bi-box-arrow-right me-2"></i>
                    Logout
                </a>

            {% else %}

                <a class="nav-link"
                   href="{{ url_for('login') }}">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Login
                </a>

                <a class="nav-link"
                   href="{{ url_for('registrazione') }}">
                    <i class="bi bi-person-plus me-2"></i>
                    Registrati
                </a>

            {% endif %}

        </nav>

        <small class="mt-auto text-secondary sidebar-footer">
            DISMAT Mini Magazzino
        </small>

    </aside>


    <div class="content">

        <header class="topbar">

            <span class="fw-semibold topbar-title">
                Gestione Magazzino
            </span>

            <div class="d-flex align-items-center gap-3">

                <div class="theme-switch">

                    <button class="theme-btn"
                            data-theme="light"
                            type="button"
                            title="Tema chiaro">

                        <i class="bi bi-sun-fill"></i>

                    </button>

                    <button class="theme-btn"
                            data-theme="dark"
                            type="button"
                            title="Tema scuro">

                        <i class="bi bi-moon-stars-fill"></i>

                    </button>

                </div>

                <span class="badge rounded-pill text-bg-warning">
                    DISMAT
                </span>

            </div>

        </header>


        <main>
            {% block content %}
            {% endblock %}
        </main>

    </div>

</div>


<button class="btn chat-button">
    <i class="bi bi-chat-dots me-2"></i>
    Assistente
</button>


<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>

</html>
