<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrazione - DISMAT Mini Magazzino</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dark-theme">

<div class="auth-page">

    <div class="auth-card">

        <img src="{{ url_for('static', filename='images/logo-dismat.jpeg') }}"
             alt="DISMAT"
             class="auth-logo">

        <h2 class="auth-title">
            Crea account
        </h2>

        <p class="auth-subtitle">
            DISMAT Mini Magazzino
        </p>

        {% if errore %}
            <div class="alert alert-danger">
                {{ errore }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="mb-3">
                <label class="form-label" for="nome">
                    Nome
                </label>

                <input type="text"
                       class="form-control"
                       id="nome"
                       name="nome"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="username">
                    Username
                </label>

                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">
                    Password
                </label>

                <div class="input-group">
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           required>

                    <button type="button"
                            class="btn password-toggle"
                            onclick="togglePassword('password', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="conferma_password">
                    Conferma password
                </label>

                <div class="input-group">
                    <input type="password"
                           class="form-control"
                           id="conferma_password"
                           name="conferma_password"
                           required>

                    <button type="button"
                            class="btn password-toggle"
                            onclick="togglePassword('conferma_password', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit"
                    class="btn btn-warning auth-button w-100">
                Registrati
            </button>

        </form>

        <div class="text-center mt-4">
            <span class="text-secondary">
                Hai già un account?
            </span>

            <a href="{{ url_for('login') }}"
               class="auth-link">
                Accedi
            </a>
        </div>

    </div>

</div>

<script>
function togglePassword(id, button) {
    const input = document.getElementById(id);
    const icon = button.querySelector("i");

    if (input.type === "password") {
        input.type = "text";
        icon.className = "bi bi-eye-slash";
    } else {
        input.type = "password";
        icon.className = "bi bi-eye";
    }
}
</script>

</body>
</html>
