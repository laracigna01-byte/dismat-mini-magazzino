{% extends "base.html" %}

{% block content %}

<div class="mb-4">
    <h1 class="h2">Modifica articolo</h1>
    <p class="text-secondary">
        Modifica i dati dell'articolo selezionato.
    </p>
</div>

<div class="card form-card shadow-sm">
    <div class="card-body p-4">

        <form method="POST">

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Codice</label>
                    <input type="text"
                           name="codice"
                           class="form-control"
                           value="{{ articolo.codice }}"
                           required>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Nome articolo</label>
                    <input type="text"
                           name="nome"
                           class="form-control"
                           value="{{ articolo.nome }}"
                           required>
                </div>

                <div class="col-12">
                    <label class="form-label">Descrizione</label>
                    <textarea name="descrizione"
                              class="form-control">{{ articolo.descrizione or '' }}</textarea>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Quantità</label>
                    <input type="number"
                           step="0.01"
                           name="quantita"
                           class="form-control"
                           value="{{ articolo.quantita }}"
                           required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Scorta minima</label>
                    <input type="number"
                           step="0.01"
                           name="scorta_minima"
                           class="form-control"
                           value="{{ articolo.scorta_minima }}"
                           required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Unità di misura</label>

                    <select name="unita_misura"
                            class="form-select">

                        {% for unita in ["pz", "kg", "m", "l"] %}
                            <option value="{{ unita }}"
                                {% if articolo.unita_misura == unita %}selected{% endif %}>
                                {{ unita }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Categoria</label>

                    <select name="categoria_id"
                            class="form-select">

                        {% for categoria in categorie %}

                            <option value="{{ categoria.id }}"
                                {% if articolo.categoria_id == categoria.id %}selected{% endif %}>
                                {{ categoria.nome }}
                            </option>

                        {% endfor %}

                    </select>
                </div>

            </div>

            <div class="mt-4">

                <button type="submit"
                        class="btn btn-warning fw-semibold">
                    Salva modifiche
                </button>

                <a href="/"
                   class="btn btn-light ms-2">
                    Annulla
                </a>

            </div>

        </form>

    </div>
</div>

{% endblock %}
