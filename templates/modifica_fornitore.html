{% extends "base.html" %}

{% block content %}

<div class="dashboard-heading">

    <div class="eyebrow">
        DISMAT • SISTEMA INTERNO
    </div>

    <h1 class="neon-title">
        MODIFICA FORNITORE
    </h1>

    <p class="dashboard-subtitle">
        Aggiornamento dei dati del fornitore
    </p>

</div>


<div class="card inventory-card">

    <div class="card-header inventory-header">

        <div>
            <div class="inventory-title">
                {{ fornitore.ragione_sociale }}
            </div>

            <small class="inventory-subtitle">
                Modifica le informazioni registrate
            </small>
        </div>

    </div>


    <div class="card-body p-4">

        <form method="POST">

            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Ragione sociale
                    </label>

                    <input type="text"
                           class="form-control"
                           name="ragione_sociale"
                           value="{{ fornitore.ragione_sociale }}"
                           required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Referente
                    </label>

                    <input type="text"
                           class="form-control"
                           name="referente"
                           value="{{ fornitore.referente or '' }}">

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Telefono
                    </label>

                    <input type="text"
                           class="form-control"
                           name="telefono"
                           value="{{ fornitore.telefono or '' }}">

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           name="email"
                           value="{{ fornitore.email or '' }}">

                </div>

            </div>


            <div class="d-flex flex-wrap gap-3 mt-4">

                <button type="submit"
                        class="btn btn-warning add-button">

                    <i class="bi bi-check-lg me-1"></i>
                    Salva modifiche

                </button>

                <a href="{{ url_for('fornitori') }}"
                   class="btn btn-outline-light add-button">

                    Annulla

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
